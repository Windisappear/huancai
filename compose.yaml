name: frame-studio
x-app: &app
  image: frame-studio:0.2.0
  build: .
  env_file: .env.production
  environment:
    NODE_ENV: production
    DEMO_MODE: "false"
    STORAGE_DRIVER: s3
    SESSION_SECURE: "true"
    REDIS_URL: redis://redis:6379
  restart: unless-stopped
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}
services:
  web:
    <<: *app
    expose: ["3000"]
  worker:
    <<: *app
    command: ["npm", "run", "worker"]
  migrate:
    <<: *app
    restart: "no"
    profiles: ["setup"]
    command: ["sh", "-c", "npm run db:migrate && npm run db:seed"]
  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_USER: frame
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in --env-file}
      POSTGRES_DB: frame
    volumes: ["pgdata:/var/lib/postgresql/data"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U frame -d frame"]
      interval: 5s
      retries: 20
  redis:
    image: redis:7.4.2-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes: ["redisdata:/data"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20
  nginx:
    image: nginx:1.28.0-alpine
    ports: ["80:80", "443:443"]
    volumes: ["./deploy/nginx.conf:/etc/nginx/nginx.conf:ro", "./deploy/certs:/etc/nginx/certs:ro"]
    depends_on: [web]
    restart: unless-stopped
volumes:
  pgdata:
  redisdata:
