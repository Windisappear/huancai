name: frame-studio-dev
services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16.6-alpine}
    environment:
      POSTGRES_USER: frame
      POSTGRES_PASSWORD: frame_local_only
      POSTGRES_DB: frame
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U frame -d frame"]
      interval: 3s
      retries: 20
  redis:
    image: ${REDIS_IMAGE:-redis:7.4.2-alpine}
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports: ["127.0.0.1:16379:6379"]
    volumes: ["redisdata:/data"]
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: frame_local
      MINIO_ROOT_PASSWORD: frame_local_storage_only
    ports: ["127.0.0.1:59000:9000", "127.0.0.1:59001:9001"]
    volumes: ["objects:/data"]
volumes:
  pgdata:
  redisdata:
  objects:
